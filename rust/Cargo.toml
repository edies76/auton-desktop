[workspace]
members = ["auton-core", "auton-desktop"]
resolver = "2"

[workspace.package]
edition = "2024"
license = "Apache-2.0"
version = "0.1.0"

[workspace.dependencies]
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
uuid = { version = "1", features = ["v7", "serde"] }
tempfile = "3"

[patch.crates-io]
# xattr 0.2.3 groups Linux with macOS when looking up ENOATTR, a libc
# constant that Linux does not provide. Linux calls the equivalent ENODATA.
xattr = { path = "patches/xattr-0.2.3" }
